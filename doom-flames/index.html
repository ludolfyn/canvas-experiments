<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./app.css">
    <title>Doom flames</title>
</head>
<body>
    <div class="controls">
        <div class="title">
            <div>Controls</div>
            <button id="reset-controls">Reset</button>
        </div>
        <div class="body">
            <div class="input-wrap">
                <label>Flame size (<span>128</span>)</label>
                <input type="range" min="23" max="128" step="1" value="128" data-key="rowsAmount">
            </div>  
            <div class="input-wrap">
                <label>Wind (<span>2</span>)</label>
                <input type="range" min="0" max="4" step="1" value="2" data-key="windSpeed">
            </div>  
            <div class="input-wrap">
                <label>Pixel size (<span>4</span>)</label>
                <input type="range" min="2" max="16" step="1" value="4" data-key="pxSize">
            </div>
            <div class="input-wrap">
                <label>FPS (<span>0 - refresh rate</span>)</label>
                <input type="range" min="0" max="60" step="1" value="0" data-key="fps">
            </div>
            <div class="input-wrap">
                <label>Color (<span>#ffa500</span>)</label>
                <input type="color" value="#ffa500" data-key="color">
            </div>
        </div>
    </div>
    <div class="canvas-wrap">
        <canvas id="c" width="1024" height="768"></canvas>
    </div>    

    <script type="module" src="./flames.js"></script>
    <script type="module" src="./controls.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
